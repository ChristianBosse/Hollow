[package]
name = "hollow-app"
description = "Hollow's broker: starts and polices the sandboxed processes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The library is the broker's pure logic (URL policy, form encoding), which
# the fuzz targets drive; the binary is the broker itself.
[lib]
path = "src/lib.rs"

[[bin]]
name = "hollow"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
getrandom = "0.4.3"
hollow-engine.workspace = true
hollow-ipc.workspace = true
png = { version = "0.18.1", optional = true }
psl = "2.1.245"
serde = "1.0.229"
thiserror = "2.0.21"
url = "2.5.8"

# Only the binary uses these, and it is Windows-only; leaving them out
# elsewhere lets the library (and the fuzz targets) build on Linux CI.
[target.'cfg(windows)'.dependencies]
hollow-sandbox.workspace = true
softbuffer = "0.4"
winit = "0.30"

[features]
# Development only: dump composed window frames to $HOLLOW_DEV_DUMP (the window
# is excluded from screen capture). Never enabled by dist builds.
dev-dump = ["dep:png"]
