[package]
name = "xtask"
description = "Hollow developer checks: reproducible dist build, repro check, host leak and trace tests, WPT, fuzzing (cargo xtask <cmd>)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
hollow-engine = { workspace = true, features = ["test-fonts"] }
hollow-fuzz-targets = { path = "../hollow-fuzz-targets" }
netstat2 = "0.11.2"
png = "0.18.1"
scraper = "0.29.0"
serde_json = "1.0.154"
sha2 = "0.10.9"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
url = "2.5.8"
