[package]
name = "hollow-net"
description = "Hollow's network process: the only process allowed to open sockets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
arti-client = { version = "0.47.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "static-sqlite", "keymgr"] }
bytes = "1.12.1"
futures = "0.3.34"
hollow-ipc.workspace = true
hollow-sandbox.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tor-rtcompat = { version = "0.47.0", default-features = false, features = ["tokio", "rustls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
webpki-roots = "1.0.11"
